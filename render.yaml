services:
  - type: web
    name: invoice-action-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /.well-known/agent-card.json
    envVars:
      - key: A2A_BASE_URL
        value: https://invoice-action-agent-eucd.onrender.com/a2a/
      - key: A2A_BEARER_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GEMINI_MODEL
        value: qwen/qwen3.8-27b
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-agent-db
          property: connectionString

databases:
  - name: invoice-agent-db
    databaseName: invoice_agent
    plan: free
