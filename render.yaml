services:
  - type: web
    name: invoice-action-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /.well-known/agent-card.json
    envVars:
      - key: A2A_BASE_URL
        value: https://invoice-action-agent-eucd.onrender.com/a2a/
      - key: A2A_BEARER_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-agent-db
          property: connectionString

databases:
  - name: invoice-agent-db
    databaseName: invoice_agent
    plan: free
